<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💖</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins&display=swap" rel="stylesheet">

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- Preload images -->
<link rel="preload" as="image" href="gift-box.jpg">
<link rel="preload" as="image" href="rose.jpg">
<link rel="preload" as="image" href="rose-1.jpg">

<style>
html,body{
  margin:0;
  padding:0;
  min-height:100%;
}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffe6ee,#fff0f5,#fbeaff);
  background-size:400% 400%;
  animation:bgMove 15s ease infinite;
  overflow-x:hidden;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Hearts */
.heart-bg{
  position:fixed;
  inset:0;
  background-image:radial-gradient(#ffb6c1 2px, transparent 2px);
  background-size:40px 40px;
  opacity:.25;
  z-index:0;
  pointer-events:none;
}

/* Glass card */
.card{
  position:relative;
  z-index:1;
  max-width:420px;
  margin:30px auto;
  padding:26px 22px 30px;
  border-radius:22px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(14px);
  box-shadow:0 20px 40px rgba(0,0,0,.18);
  text-align:center;
}

/* LOCK overlay */
.locked{
  position:relative;
}
.locked::after{
  content:"🔒 Unlocks on 12 February, 12:00 AM";
  position:absolute;
  inset:0;
  background:rgba(255,240,245,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:15px;
  color:#ff4d6d;
  border-radius:18px;
  padding:10px;
  z-index:5;
}

/* Text */
h1{
  font-family:'Dancing Script',cursive;
  font-size:38px;
  color:#ff4d6d;
  margin:10px 0 15px;
}
#countdown{
  font-size:17px;
  color:#555;
}
#age{
  font-size:40px;
  color:#ff4d6d;
  margin:18px 0;
}

/* Video */
.video iframe{
  width:100%;
  height:200px;
  border-radius:16px;
  border:none;
}

/* Gift */
.gift-box{
  font-size:75px;
}
.open-text{
  font-size:15px;
  color:#ff4d6d;
}

/* Images */
img{
  width:100%;
  max-width:360px;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  margin-top:15px;
}

/* Footer */
footer{
  margin-top:25px;
  font-size:14px;
  color:#777;
}
footer a{
  color:#ff4d6d;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="heart-bg"></div>

<div class="card">

  <!-- NAME LOCKED -->
  <div class="locked">
    <h1>Happy Birthday<br>Snigdha Afrin Ety 🎂💖</h1>
  </div>

  <div id="countdown"></div>
  <div id="age"></div>

  <!-- VIDEO LOCKED -->
  <div class="video locked">
    <iframe src="https://streamable.com/e/tsgee9"></iframe>
  </div>

  <!-- GIFT LOCKED -->
  <div class="locked" style="margin-top:25px;">
    <div class="gift-box">🎁</div>
    <div class="open-text">Open Gift Box</div>
  </div>

  <!-- ROSE 1 LOCKED -->
  <div class="locked" style="margin-top:25px;">
    <img src="rose.jpg">
  </div>

  <!-- ROSE 2 LOCKED -->
  <div class="locked" style="margin-top:25px;">
    <img src="rose-1.jpg">
  </div>

  <!-- FOOTER LOCKED -->
  <footer class="locked" style="margin-top:20px;">
    Developed by <a href="#">Saiful</a> 💖
  </footer>

</div>

<script>
// ===== DATE SETUP =====
const unlockTime = new Date("2026-02-12T00:00:00"); // 12 Feb, 12:00 AM
const now = new Date();

// AGE
const birth = new Date("2008-02-12");
let age = now.getFullYear() - birth.getFullYear();
if(now < new Date(now.getFullYear(),1,12)) age--;
document.getElementById("age").innerHTML = "Turning " + age + " ✨";

// COUNTDOWN
setInterval(()=>{
  let diff = unlockTime - new Date();
  if(diff <= 0){
    location.reload(); // auto unlock by reload
  }
  let d=Math.floor(diff/86400000);
  let h=Math.floor(diff/3600000)%24;
  let m=Math.floor(diff/60000)%60;
  let s=Math.floor(diff/1000)%60;
  document.getElementById("countdown").innerHTML =
    `🎉 Unlocks in ${d}d ${h}h ${m}m ${s}s`;
},1000);
</script>

</body>
</html>
